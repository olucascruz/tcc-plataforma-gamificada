<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="760" viewBox="0 0 1020 760"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><circle cx="185.0" cy="54" r="34" fill="#08427B"/><rect x="40" y="78" width="290" height="92" rx="38" fill="#08427B"/><text x="185.0" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Trainee</text><text x="185.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">[Usuário]</text><text x="185.0" y="144" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">Colaborador em capacitação</text><circle cx="485.0" cy="54" r="34" fill="#08427B"/><rect x="340" y="78" width="290" height="92" rx="38" fill="#08427B"/><text x="485.0" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Instrutor</text><text x="485.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">[Usuário]</text><text x="485.0" y="144" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">Cria avaliações, gerencia turmas e</text><text x="485.0" y="159" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">acompanha o desempenho</text><rect x="100" y="270" width="440" height="110" rx="12" fill="#1168BD" stroke="#0B3E75" stroke-width="1"/><text x="320.0" y="300" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Sistema gamificado</text><text x="320.0" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">[Software System]</text><text x="320.0" y="338" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">Plataforma de avaliação gamificada</text><rect x="640" y="270" width="280" height="110" rx="12" fill="#1168BD" stroke="#0B3E75" stroke-width="1"/><text x="780.0" y="300" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Pipeline de geração de questões</text><text x="780.0" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">[Software System]</text><text x="780.0" y="338" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">Gera questões a partir dos documentos e</text><text x="780.0" y="353" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">as mantém atualizadas por rotina semanal</text><rect x="40" y="580" width="260" height="135" rx="12" fill="#8C8496" stroke="#0B3E75" stroke-width="1"/><text x="170.0" y="610" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">SSO</text><text x="170.0" y="628" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">[Software System]</text><text x="170.0" y="648" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">Dosso, autenticação corporativa sobre</text><text x="170.0" y="663" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">o Microsoft Entra ID</text><rect x="360" y="580" width="360" height="135" rx="12" fill="#8C8496" stroke="#0B3E75" stroke-width="1"/><text x="540.0" y="610" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Databricks</text><text x="540.0" y="628" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">[Software System]</text><text x="540.0" y="648" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">Plataforma de dados e IA: banco da aplicação</text><text x="540.0" y="663" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">(Lakebase), banco de questões (Delta), revisões dos</text><text x="540.0" y="678" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">documentos e modelos de IA (AI Gateway)</text><rect x="760" y="580" width="220" height="135" rx="12" fill="#8C8496" stroke="#0B3E75" stroke-width="1"/><text x="870.0" y="610" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">SoftExpert</text><text x="870.0" y="628" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">[Software System]</text><text x="870.0" y="648" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">Gestão de documentos e</text><text x="870.0" y="663" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#fff" text-anchor="middle">procedimentos corporativos</text><rect x="700" y="40" width="280" height="96" rx="6" fill="#fff" stroke="#bbb" stroke-width="0.8"/><text x="840" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Legenda</text><rect x="716" y="72" width="18" height="14" rx="3" fill="#08427B"/><text x="742" y="84" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">Usuário</text><rect x="716" y="92" width="18" height="14" rx="3" fill="#1168BD"/><text x="742" y="104" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">Sistema desenvolvido neste trabalho</text><rect x="716" y="112" width="18" height="14" rx="3" fill="#8C8496"/><text x="742" y="124" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">Sistema externo (corporativo)</text><path d="M185,170 L185,270" fill="none" stroke="#222" stroke-width="1.4"  marker-end="url(#a)" /><rect x="97.10000000000001" y="196.5" width="175.79999999999998" height="51" fill="#fff" fill-opacity="0.95" stroke="#bbb" stroke-width="0.6"/><text x="185" y="210.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">Realiza avaliações e</text><text x="185" y="225.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">acompanha o desempenho via</text><text x="185" y="240.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">HTTPS</text><path d="M485,170 L485,270" fill="none" stroke="#222" stroke-width="1.4"  marker-end="url(#a)" /><rect x="393.95" y="189.0" width="182.1" height="66" fill="#fff" fill-opacity="0.95" stroke="#bbb" stroke-width="0.6"/><text x="485" y="203.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">Seleciona e revisa questões</text><text x="485" y="218.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">do banco, cria avaliações e</text><text x="485" y="233.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">visualiza relatórios via</text><text x="485" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">HTTPS</text><path d="M200,380 L200,580" fill="none" stroke="#222" stroke-width="1.4"  marker-end="url(#a)" /><rect x="137.3" y="462.0" width="125.39999999999999" height="36" fill="#fff" fill-opacity="0.95" stroke="#bbb" stroke-width="0.6"/><text x="200" y="476.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">Autentica usuários</text><text x="200" y="491.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">via HTTPS</text><path d="M440,380 L440,580" fill="none" stroke="#222" stroke-width="1.4"  marker-end="url(#a)" /><rect x="355.25" y="447.0" width="169.5" height="66" fill="#fff" fill-opacity="0.95" stroke="#bbb" stroke-width="0.6"/><text x="440" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">Lê e grava dados</text><text x="440" y="476.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">(questões, avaliações,</text><text x="440" y="491.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">resultados) via protocolo</text><text x="440" y="506.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">PostgreSQL</text><path d="M680,380 L680,580" fill="none" stroke="#222" stroke-width="1.4"  marker-end="url(#a)" /><rect x="592.1" y="439.5" width="175.79999999999998" height="81" fill="#fff" fill-opacity="0.95" stroke="#bbb" stroke-width="0.6"/><text x="680" y="453.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">Consulta revisões e</text><text x="680" y="468.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">grava/inativa questões via</text><text x="680" y="483.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">API SQL (HTTPS); gera e</text><text x="680" y="498.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">revisa questões com IA via</text><text x="680" y="513.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">HTTPS</text><path d="M880,380 L880,580" fill="none" stroke="#222" stroke-width="1.4"  marker-end="url(#a)" /><rect x="814.15" y="462.0" width="131.7" height="36" fill="#fff" fill-opacity="0.95" stroke="#bbb" stroke-width="0.6"/><text x="880" y="476.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">Baixa os documentos</text><text x="880" y="491.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="middle">(PDF) via HTTPS</text></svg>